<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Opportunity Atlas — Heerlen proefversie</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <aside id="sidebar">
      <h2>Datasets</h2>
      <div id="import-area">
        <input id="file-input" type="file" />
      </div>
      <div id="api-area" style="margin-top:10px">
        <h3>API's</h3>
        <button id="load-buurten">Laad PDOK Buurten (Heerlen)</button>
        <button id="load-wijken">Laad PDOK Wijken (Heerlen)</button>
        <div style="margin-top:6px">
          <input id="api-url" type="text" placeholder="Vul een GeoJSON/JSON API URL in" style="width:100%" />
          <button id="load-api">Laad URL</button>
        </div>
      </div>
      <div id="controls">
        <label for="field-select">Selecteer variabele:</label>
        <select id="field-select">
          <option value="">-- geen --</option>
        </select>
        <button id="start-compare">Start vergelijkmodus</button>
      </div>
      <div id="visual-options" style="margin-top:10px">
        <label for="method-select">Classificatie:</label>
        <select id="method-select">
          <option value="quantile">Kwantiel</option>
        </select>
        <br/>
        <label for="palette-select" style="margin-left:8px">Palet:</label>
        <select id="palette-select">
          <option value="viridis">Viridis</option>
          <option value="rdylgn">RdYlGn</option>
          <option value="blues">Blues</option>
          <option value="oranges">Oranges</option>
        </select>
        <div style="margin-top:6px">
          <label for="opacity-range">Dekking:</label>
          <input id="opacity-range" type="range" min="0" max="1" step="0.05" value="0.8" />
        </div>
      </div>
      <div id="filter-area" style="margin-top:12px;border-top:1px solid #eee;padding-top:8px">
        <h3>Filter & uitschieters</h3>
        <div style="font-size:13px;color:#333;margin-bottom:6px">De verdeling van de gekozen variabele kan worden beïnvloed door extreme waarden. Gebruik filters of percentiel-clip om uitschieters te dempen.</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <label style="font-size:13px">Min:</label>
          <input id="filter-min" type="number" style="width:100px" />
          <label style="font-size:13px">Max:</label>
          <input id="filter-max" type="number" style="width:100px" />
        </div>
        <div style="margin-top:6px;display:flex;gap:8px;align-items:center">
          <label style="font-size:13px">Trim percentielen:</label>
          <input id="filter-lowpct" type="number" min="0" max="50" step="1" placeholder="onder %" style="width:80px" />
          <input id="filter-highpct" type="number" min="50" max="100" step="1" placeholder="boven %" style="width:80px" />
        </div>
        <div style="margin-top:8px">
          <button id="apply-filter">Pas filter toe</button>
          <button id="filter-negative">Filter negatieve waarden</button>
          <button id="clear-filter">Wis filter</button>
        </div>
      </div>
      <div id="legend" aria-hidden="false" style="margin-top:12px"></div>
      <div id="charts" aria-live="polite"></div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
  <script src="js/app.js"></script>
  <script src="js/map.js"></script>
  <script src="js/importer.js"></script>
  <script src="js/d3_charts.js"></script>
</body>
</html>
