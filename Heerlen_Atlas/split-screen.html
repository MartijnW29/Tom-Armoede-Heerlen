<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Opportunity Atlas — Splitscherm</title>
  <style>
    :root {
      --bg: #0f172a;
      --accent: #0b7285;
      --accent-hover: #0a5d6c;
      --text: #e2e8f0;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at top, #1e293b 0%, #0f172a 55%, #020617 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .shell-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.88);
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      backdrop-filter: blur(10px);
      z-index: 2;
    }

    .shell-header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .shell-header p {
      margin: 2px 0 0;
      font-size: 12px;
      color: rgba(226, 232, 240, 0.72);
    }

    .shell-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .shell-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      background: var(--accent);
      transition: background 0.2s ease;
    }

    .shell-actions a:hover {
      background: var(--accent-hover);
    }

    .split-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
      flex: 1;
    }

    .split-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .split-frame.left {
      border-right: 1px solid rgba(148, 163, 184, 0.18);
    }

    @media (max-width: 1100px) {
      .split-grid {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }

      .split-frame.left {
        border-right: 0;
        border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      }

      .shell-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header class="shell-header">
    <div>
      <h1>Splitscherm</h1>
      <p>Twee gekoppelde kaarten met aparte filters, jaarinstellingen en legenda's per helft.</p>
    </div>
    <div class="shell-actions">
      <a href="index.html">Terug naar enkel scherm</a>
    </div>
  </header>

  <main class="split-grid" aria-label="Gesplitste kaartweergave">
    <iframe class="split-frame left" title="Linker kaart" src="index.html?split=1&sidebar=left&panel=left"></iframe>
    <iframe class="split-frame right" title="Rechter kaart" src="index.html?split=1&sidebar=right&panel=right"></iframe>
  </main>

  <script>
    // Geeft kaartuitsnede en hover van de ene helft door aan de andere helft
    const frames = { left: document.querySelector('.split-frame.left'), right: document.querySelector('.split-frame.right') };
    const andere = kant => (kant === 'left' ? 'right' : 'left');
    const doorsturen = { 'heerlen-map-view': 'heerlen-set-map-view', 'heerlen-hover': 'heerlen-set-hover', 'heerlen-hover-clear': 'heerlen-clear-hover' };
    const laatsteUitsnede = {};

    function stuur(naar, bericht) {
      frames[naar].contentWindow?.postMessage({ ...bericht, panelId: naar }, '*');
    }

    window.addEventListener('message', ({ data }) => {
      const type = doorsturen[data?.type];
      if (!type || !frames[data.panelId]) return;
      if (data.type === 'heerlen-map-view') laatsteUitsnede[data.panelId] = { center: data.center, zoom: data.zoom };
      stuur(andere(data.panelId), { ...data, type });
    });

    // Een helft die (opnieuw) laadt, neemt de uitsnede van de andere helft over
    for (const kant in frames) {
      frames[kant].addEventListener('load', () => {
        const uitsnede = laatsteUitsnede[andere(kant)];
        if (uitsnede) stuur(kant, { type: 'heerlen-set-map-view', ...uitsnede });
      });
    }
  </script>
</body>
</html>
